# hermes-safe-update configuration (example)
#
# Copy this file to:
#   Windows: %LOCALAPPDATA%\hermes\safe-update.yaml
#   macOS / Linux: ~/.hermes/safe-update.yaml
# or pass --config <path>. Every value below is the built-in default, so you
# only need to keep the keys you change; delete the rest.
#
# YAML pitfalls:
#   * Indent with spaces. Tab characters are an error.
#   * Quote strings. Unquoted no / yes / on / off / 1.10 can be read as
#     booleans or numbers by some YAML tools; this file quotes all strings.
#   * Unknown or misspelled keys are an error that names the line, so a typo
#     never silently does nothing.
#   * Maps (step_seconds, hues, section_icons) merge with the defaults key by
#     key; lists (keep_new, union, hooks) replace the default list.
#
# Machine-specific facts (the mirror location, "never offer the mirror")
# live in safe-update.json next to this file. The tool writes that file;
# do not sync it between machines.

paths:
  # Empty = detect. ~, $VAR, ${VAR} and %VAR% are expanded in these three
  # fields only.
  hermes_home: ""   # default: %LOCALAPPDATA%\hermes (Windows), ~/.hermes (macOS, Linux)
  checkout: ""      # default: <hermes_home>/hermes-agent
  user_data: ""     # desktop userData; default: %APPDATA%\Hermes, ~/Library/Application Support/Hermes, ~/.config/Hermes

tunables:
  min_free_gb: 5             # pre-flight stops below this much free disk (decimal GB) on the Hermes drive
  idle_window_s: 180         # a session active within this many seconds counts as busy
  idle_poll_s: 60            # re-check busy sessions this often while waiting
  idle_wait_max_s: 1800      # give up (nothing changed) after waiting this long for idle sessions
  confirm_timeout_s: 600     # the final "Press Y" prompt auto-aborts after this (--delay overrides). If you
                             # answer after more than a minute, busy sessions are checked once more first.
                             # Hermes' checkout lock is looked at again right before Hermes closes whenever
                             # the last look is over a minute old (any mode, also after F, --yes, --unattended)
  graceful_close_s: 30       # wait this long for the desktop app to close before forcing it
  update_timeout_s: 5400     # hard cap for `hermes update` (90 min)
  silent_warn_s: 600         # note once when the update prints nothing for this long
  verify_wait_s: 120         # wait this long for the gateway to report the new code
  marker_refresh_s: 120      # rewrite the update-in-progress marker this often
  # Time estimates (progress bar and "about N min left"):
  estimate_window: 5         # mean of the last N matching runs
  estimate_overrun_k: 0.5    # once a step runs over its estimate, expect k x elapsed more
  estimate_class_damp: 0.15  # how strongly a slow network/machine today scales later steps
  estimate_class_min: 0.8    # lower clamp of that scale factor
  estimate_class_max: 2.5    # upper clamp of that scale factor
  history_keep: 40           # timing records kept (full updates and other runs separately)
  step_seconds:              # seed estimates per step, used until timing history exists
    local: 1
    remote: 75
    procs: 3
    wait: 0
    close: 8
    gateway_stop: 23
    fetch: 10
    pull: 90
    pydeps: 64
    frontend: 25
    desktop: 210
    package: 22
    finalize: 12
    restart: 30
    verify: 5
    settings: 10
    relaunch: 1
    cleanup: 3
    cua: 7
    hooks: 8
    sessions: 1
    gc_preview: 9
    cua_status: 5

theme:
  margin: 2                  # columns of left margin
  label_width: 15            # width of the key column in key/value rows
  status_width: 50           # fixed width of the status text right of the progress bar
  max_width: 400             # never draw wider than this
  bar_band: 6                # gradient bar colour bands, in cells
  bar_from: [95, 175, 255]   # gradient start (RGB)
  bar_to: [95, 215, 135]     # gradient end (RGB)
  date_top_right: true       # show only the date at the top right
  taskbar: true              # taskbar / terminal progress where supported (macOS/Linux: only with HERMES_SAFE_UPDATE_OSC_PROGRESS=1)
  flash: true                # flash the taskbar button when input is needed or the run ends (Windows only)
  title_update: "Hermes Safe Update"
  title_check: "Hermes Update Check"
  colors:                    # SGR parameters (xterm-256: "38;5;N")
    accent: "38;5;80"
    ok: "38;5;78"
    warn: "38;5;221"
    err: "38;5;203"
    dim: "38;5;245"
    faint: "38;5;240"
    soft: "38;5;250"
    label: "38;5;110"
    token: "38;5;183"
    neutral: "38;5;242"
    track: "38;5;236"
    prompt: "38;5;221;1"
  glyphs:                    # defaults are single-width characters the Windows console font (Consolas) has
    ok: "√"
    err: "×"
    warn: "!"
    info: "i"
    command: "»"
    active: "►"
    pending: "○"
    dot: "●"
    bar: "█"
    rule: "━"
    rule_thin: "─"
    sep: "·"
    gutter: "│"
    arrow: "→"
    title: "♦"
    section: "▸"
  hues:                      # per stage group: bright and dark xterm-256 colour, icon
    "Check": {bright: 80, dark: 30, icon: "◊"}
    "Close Hermes": {bright: 215, dark: 130, icon: "■"}
    "Update": {bright: 75, dark: 25, icon: "↓"}
    "Build": {bright: 141, dark: 97, icon: "≡"}
    "Finish": {bright: 78, dark: 29, icon: "♦"}
    "Local": {bright: 80, dark: 30, icon: "⌂"}
    "Updates": {bright: 75, dark: 25, icon: "↓"}
    "Hermes": {bright: 141, dark: 97, icon: "♦"}
    "Housekeeping": {bright: 78, dark: 29, icon: "♣"}
  section_icons:             # section title prefix -> icon
    "Dependency generation cleanup": "♣"
    "Verify": "√"
    "cua-driver": "►"
    "Close": "■"
    "Relaunch": "↑"
    "Pre-flight": "◊"
    "Settings": "≡"

mirror:
  path: ""                   # fallback only; the mirror set up by `mirror setup` is recorded in safe-update.json
  offer: true                # offer to set up a mirror after a run (never in --unattended)
  offer_timeout_s: 45
  cron_schedule: "every 4h"  # Hermes cron schedule of the background refresh job
  job_name: "Hermes update mirror refresh"
  keep_free_gb: 5            # a mirror location needs repo size x (1 + growth) + keep_free_gb free
  growth: 0.5

settings:
  auto_migrate: true         # back up and migrate desktop settings after every verified update
  backup_retention: 3        # keep the newest N settings backups
  backup_dir: ""             # default: <hermes_home>/backups
  origin: ""                 # target renderer origin; default: detected from the installed build
  # Key lists use * as the only wildcard. Keys in neither list are plain
  # preferences: the old origin's value wins on the first migration after an
  # origin change, the new origin's value on later runs.
  keep_new:                  # live-state keys: the new origin's value always stays
    - "hermes.desktop.lastRoute.profile.*"
    - "hermes.desktop.lastSessionId.profile.*"
    - "hermes.desktop.freshDraftKey"
    - "hermes.updates.last-passive-check"
    - "hermes.desktop.tips.next.v1"
  union:                     # session-keyed maps / pair lists: union, new wins per entry
    - "hermes.desktop.threadScroll.v1.profile.*"
    - "hermes.desktop.sessionSeenCounts"
    - "hermes.desktop.unreadFinishedSessions"
    - "hermes.desktop.sessionOwnerHints.v1"
    - "hermes.desktop.toolDisclosure.v1"

desktop:
  # Whether the desktop app is opened again after a run:
  #   "auto"    only if it was running when the update started (default)
  #   "always"  also after a verified update when it was already closed at
  #             the start (you closed it yourself a moment before). Not in
  #             --unattended runs: those only reopen an app they closed.
  #   "never"   leave it closed
  # --no-relaunch overrides all three for one run.
  relaunch: "auto"

update:
  # Which Hermes update channel a run follows (--channel overrides it for one run):
  #   "follow"  the channel Hermes itself uses for this install (default). Hermes
  #             decides: a per-install record (Settings, About, or
  #             `hermes update --set-channel`), else "stable" for a checkout of
  #             the official GitHub repo and "main" for a fork. Safe Update only
  #             reads that choice; it never writes it.
  #   "stable"  always the latest published release (needs a Hermes with release
  #             channels, v0.21.6 or newer); a checkout that is ahead of it waits
  #   "main"    always the tip of main (`--branch main`), as before channels existed
  # A run that would move the checkout back to an older release is controlled
  # by older_release below.
  channel: "follow"
  # What a run on the stable channel does when the latest release is not newer
  # than your build (older than it, diverged from it, or not provable to
  # contain it: a shallow clone, GitHub unable to compare):
  #   "wait"  stay on your build until a stable release includes it. Nothing is
  #           changed, nothing is asked, the run ends like an up-to-date one
  #           (exit 0, "Waiting for stable: ...", also with --unattended and
  #           --check). repair, --force and finishing an unfinished update are
  #           refused meanwhile (exit 4), because they would pass the stable
  #           update to Hermes, which moves back with no question. Default.
  #   "ask"   the older behaviour: an attended run asks for an explicit Y
  #           before moving back, --unattended and --check stop (exit 4).
  # --allow-rollback is "ask" for one run. Only the stable channel is affected.
  older_release: "wait"

preflight:
  # Checks that run before Hermes is closed. A "stop" ends the run (exit 4)
  # with nothing changed. All of them only read. Besides the two below, Safe
  # Update stops when Hermes' checkout lock is held (an update is running; no
  # setting, Windows) and checks the update marker and the free disk.
  #
  # tools\ entries your account cannot open, left behind by an elevated
  # install or update (the next update would fail with [WinError 5]). The
  # message prints the takeown / icacls commands that repair them (run those in
  # an administrator terminal).
  #   "stop"  end the run (default)   "warn"  warn and go on   "off"  skip
  acl_check: "stop"
  # Windows ARM64 only: Python dependencies are about to be rebuilt and clang
  # or the ARM64 C++ tools are missing, so the update would start a Visual
  # Studio Build Tools installer after Hermes was closed.
  #   "warn"  say so and go on (default)   "stop"  end the run   "off"  skip
  arm64_toolchain: "warn"
# Running Safe Update from an administrator terminal also stops before closing
# anything (an elevated update leaves files in tools\ that your normal account
# cannot update). --allow-elevated overrides that for one run.

extras:
  # The parts of a Hermes install that do not depend on the Hermes version:
  # catalog plugins, hub-installed skills and the bundled tools. Safe Update
  # looks at them (through Hermes' own check commands, in parallel, a few
  # seconds; Safe Update writes nothing itself) after the Hermes
  # verdict of every run, "up to date" or "waiting for stable" included, and
  # shows one row each on the card; the full detail goes to the log. It never
  # touches Hermes' own checkout, and never updates the tools: `hermes pm
  # update` rewrites Hermes' core files.
  #
  # plugins: catalog and git plugins with an update (`hermes plugins
  #   check-updates`). Plugins you copied in by hand have no source and are
  #   never touched.
  #   "ask"     list them and, on an attended run, ask for each plugin
  #             (y/N, default no; the memory provider is named and goes last)
  #             before `hermes plugins update <name>`. Hermes applies that
  #             all or nothing and Safe Update writes no file around it; it
  #             only checks afterwards that the plugin is still enabled and
  #             memory.provider unchanged. The eviction that can really happen
  #             is inside `hermes update` (a dependency rebuild that no longer
  #             builds a plugin switches it off and clears memory.provider):
  #             Safe Update compares the plugin settings before and after that
  #             update, warns on the card, and on an attended run asks once to
  #             put it back with `hermes plugins enable <name>` and `hermes
  #             config set memory.provider <name>`. --unattended, --yes and
  #             check only report (and print the commands). Hermes' own
  #             security scan still applies; Safe Update never passes --force.
  #   "report"  list only   "off"  do not look (this includes that comparison)
  plugins: "ask"
  # skills: hub-installed skills with an update (`hermes skills check`);
  # applied with `hermes skills update` after a yes. Skills you edited are
  # kept (Hermes skips them).   "ask" (default) | "report" | "off"
  skills: "ask"
  # tools: faults `hermes pm doctor` finds (shown as one row, advice in the
  # log) and, in check only, newer tool versions from `hermes pm update
  # --check` (listing only; that command needs the network and takes a
  # minute).   "report" (default) | "off"
  tools: "report"
  # On a release channel: show a row when the latest stable release is older
  # than this many days, or when commits with CVE-, GHSA- or "security" in
  # their subject are waiting on main since that release. The row names the
  # one-time way out (`hermes-safe-update --channel main`); nothing happens
  # by itself. 0 turns the row off.
  stale_days: 14

statedb:
  # Hermes' own pre-update snapshot leaves out any state.db (your session
  # history; one per profile) over 1 GiB, so an update of such an install runs
  # with no copy of it. Safe Update looks at the sizes in every run (`check`
  # too: one row) and, in an update, deals with it once Hermes is closed.
  #
  # compact: offer `hermes sessions optimize-storage` (rebuilds the search
  #   index in Hermes' compact layout and runs VACUUM). Only on an attended
  #   run, only with Hermes 0.23 or newer, and only after a Y: it needs the
  #   gateway stopped (it is restarted as after any update) and takes roughly
  #   12 min per GB. A refusal, failure, timeout or Ctrl+C never loses data and
  #   never stops the update. --unattended, --yes and `check` never compact.
  #   "ask" | "off".
  compact: "ask"
  # backup: Safe Update's own verified copy of every state.db that is still
  #   over 1 GiB when the update starts (SQLite online read, works while Hermes
  #   has the file open; checked with PRAGMA quick_check; the newest one per
  #   profile is kept, in <hermes home>\backups\safe-update-statedb). Attended
  #   and unattended alike: a copy changes nothing. "on" | "off".
  backup: "on"
  # min_free_gb: free space (decimal GB, at least 1) that must remain on the
  #   Hermes drive after a copy or a compaction; otherwise it is skipped and
  #   the card says why.
  min_free_gb: 10

# Hooks: your own commands at fixed points of the flow.
#   when: "pre-close"      before Hermes is closed (after the confirmation)
#         "post-update"    after a verified update, before Hermes reopens
#         "post-relaunch"  after Hermes reopened
#   run:  argv list; no shell is involved unless you name one as argv[0].
#   The hook's last output line becomes its row on the summary card. A
#   non-zero exit or a timeout is a warning only; it never turns a verified
#   update into a failure. Each hook gets HERMES_SAFE_UPDATE_STAGE (the
#   `when` value), HERMES_SAFE_UPDATE_RESULT, HERMES_SAFE_UPDATE_HOME (the
#   Hermes home), HERMES_SAFE_UPDATE_CHECKOUT and HERMES_SAFE_UPDATE_PYTHON
#   (Hermes' managed Python, looked up when the hook starts) in its
#   environment; unknown values are empty. See docs/configuration.md.
hooks: []
# On macOS/Linux use an argument list too, e.g. run: ["/bin/sh", "/home/you/x.sh"].
# "~" and "$VAR" are not expanded in run or dir.
# BEGIN HOOK EXAMPLE
# hooks:
#   - name: "restore-start-tile"
#     when: "post-update"
#     run: ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\you\\scripts\\restore-tile.ps1"]
#     timeout_s: 120
#     dir: ""                # working directory; default the Hermes home
# END HOOK EXAMPLE

logging:
  level: "info"              # debug | info | warn | error (--log-level overrides)
  max_size_mb: 5             # rotate the log file at this size
  keep: 3                    # rotated log files kept
